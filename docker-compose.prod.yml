version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_portal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app_network

  backend:
    image: ${BACKEND_IMAGE:-job-portal-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    depends_on:
      - db
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-job_portal}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
      REDIS_URL: redis://redis:6379
      DB_HOST: db
      DB_PORT: 5432
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      CONTACT_TO: ${CONTACT_TO}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_SIGNED_URL_EXPIRES: ${S3_SIGNED_URL_EXPIRES}
    networks:
      - app_network

  frontend:
    image: ${FRONTEND_IMAGE:-job-portal-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /
    depends_on:
      - backend
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_network

  varnish:
    image: varnish:7.4-alpine
    depends_on:
      - nginx
    ports:
      - "8081:6081"
    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl:ro
    command: ["-F","-f","/etc/varnish/default.vcl","-a",":6081","-s","malloc,256m"]
    networks:
      - app_network

  caddy:
    image: caddy:2-alpine
    depends_on:
      - varnish
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app_network

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge